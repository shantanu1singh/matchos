[project]
name = "matchos"
version = "0.1.0"
description = "Real-time personalized match intelligence on a synthetic football feed."
readme = "README.md"
license = "LicenseRef-MatchOS-Evaluation"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "agent-framework-core>=1.22,<2",
  "agent-framework-openai>=1.17,<2",
  "azure-core[aio]>=1.38,<2",
  "azure-identity>=1.25,<2",
  "litellm>=1.104.2,<2",
  "google-auth>=2.29",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13",
  "httpx>=0.27",
  "pydantic>=2",
]

[project.scripts]
matchos = "matchos.__main__:main"

[project.optional-dependencies]
telemetry = ["opentelemetry-sdk>=1.39,<2", "opentelemetry-exporter-otlp-proto-http>=1.39,<2", "azure-monitor-opentelemetry-exporter>=1.0.0b48,<2"]
evaluation = ["azure-ai-projects>=2.2,<2.3", "openai>=2.54,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["matchos", "matchos.decisions", "matchos.simulation", "matchos.web"]

[tool.setuptools.package-data]
matchos = ["web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
target-version = "py313"
line-length = 110
include = ["matchos/**/*.py", "scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
