[project]
name = "matchos"
version = "0.1.0"
description = "Real-time personalized match intelligence on a synthetic football feed."
requires-python = ">=3.10"
dependencies = [
  "agent-framework-core>=1.19",
  "agent-framework-foundry>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
