<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>MatchOS · One match. Every perspective.</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/gsap.min.js"></script>
  <style>
    html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#07110d}
    #root{position:relative;width:1920px;height:1080px;overflow:hidden}
    .scene-slot{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}
    audio{display:none}
  </style>
</head>
<body>
  <div data-hf-id="hf-jrvh" id="root" data-composition-id="main" data-start="0" data-duration="119" data-width="1920" data-height="1080">
    <div data-hf-id="hf-xqtu" id="walkthrough-host" class="clip scene-slot" data-composition-id="walkthrough" data-composition-src="compositions/walkthrough.html" data-start="0" data-duration="52" data-track-index="0" data-track-kind="graphics"></div>
    <div id="broadcast" class="clip scene-slot" data-composition-id="broadcast" data-composition-src="compositions/broadcast.html" data-start="51.55" data-duration="18.45" data-track-index="0" data-track-kind="graphics"></div>
    <div id="evaluations" class="clip scene-slot" data-composition-id="evaluations" data-composition-src="compositions/evaluations.html" data-start="69.55" data-duration="19.45" data-track-index="1" data-track-kind="graphics"></div>
    <div id="architecture" class="clip scene-slot" data-composition-id="architecture" data-composition-src="compositions/architecture.html" data-start="88.55" data-duration="14.45" data-track-index="0" data-track-kind="graphics"></div>
    <div id="partnership" class="clip scene-slot" data-composition-id="partnership" data-composition-src="compositions/partnership.html" data-start="102.55" data-duration="16.45" data-track-index="1" data-track-kind="graphics"></div>
    <audio id="spanish-commentary" src="assets/spanish-commentary.wav" data-start="29.422" data-duration="4.528" data-track-index="4" data-volume="1"></audio>
    <audio data-hf-id="hf-79bg" id="narration" src="narration.wav" data-start="0" data-duration="119" data-track-index="3" data-volume="1"></audio>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const film = gsap.timeline({paused:true});
    // Scene-container crossfades are transitions; content has no exit tween.
    const pairs=[['#walkthrough-host','#broadcast',51.55],['#broadcast','#evaluations',69.55],['#evaluations','#architecture',88.55],['#architecture','#partnership',102.55]];
    pairs.forEach(([outgoing,incoming,at])=>{
      film.fromTo(incoming,{opacity:0},{opacity:1,duration:.45,ease:'sine.inOut',immediateRender:false},at);
      film.fromTo(outgoing,{opacity:1},{opacity:0,duration:.45,ease:'sine.inOut',immediateRender:false},at);
    });
    window.__timelines.main=film;
  </script>
</body>
</html>
